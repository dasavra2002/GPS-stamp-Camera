name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a release with this tag (e.g. v1.4.0), created on the selected branch. Leave empty to just build.'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Optional: a permanent signing key from repository secrets, so app updates install
      # over the previous version. Without the secrets the debug key is used.
      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            for name in SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
              if [ -z "${!name}" ]; then
                echo "::error::SIGNING_KEYSTORE_BASE64 is set but the $name secret is missing."
                exit 1
              fi
            done
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Run unit tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/

      - name: Build APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      # Shows which certificate signed the APK, so you can check that every build uses the same key.
      - name: Show signing certificate
        run: |
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          certs="$("$apksigner" verify --print-certs app/build/outputs/apk/release/*.apk | grep -E 'Signer #1 certificate (DN|SHA-256)')"
          echo "$certs"
          if [ -n "$SIGNING_KEYSTORE" ]; then key="release key from secrets"; else key="CI debug key (changes every run)"; fi
          { echo "### APK signing"; echo; echo "Signed with: **$key**"; echo; echo '```'; echo "$certs"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GeoStampCamera-apk
          path: app/build/outputs/apk/release/*.apk

      # Pushing a tag like v1.4.0, or running this workflow by hand with release_tag set,
      # publishes a GitHub release with the APK and the notes from release-notes/<tag>.md.
      - name: Prepare release APK
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if [ -z "$SIGNING_KEYSTORE" ]; then
            echo "::warning::No signing secrets set; this release APK is signed with the CI debug key."
          fi
          test -f "release-notes/${RELEASE_TAG}.md"
          cp app/build/outputs/apk/release/*.apk "GeoStamp-Camera-${RELEASE_TAG}.apk"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: GeoStamp Camera ${{ inputs.release_tag || github.ref_name }}
          body_path: release-notes/${{ inputs.release_tag || github.ref_name }}.md
          files: GeoStamp-Camera-${{ inputs.release_tag || github.ref_name }}.apk
